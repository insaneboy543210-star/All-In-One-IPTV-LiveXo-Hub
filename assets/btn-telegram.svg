<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 54" width="240" height="54">
  <defs>
    <linearGradient id="tgBtnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0088cc"/>
      <stop offset="100%" stop-color="#00c6ff">
        <animate attributeName="stop-color" values="#00c6ff;#0088cc;#00c6ff" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="tgBtnGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="3" y="3" width="234" height="48" rx="24" fill="url(#tgBtnGrad)" filter="url(#tgBtnGlow)"/>
  <!-- Animated Pulse Ripple -->
  <rect x="3" y="3" width="234" height="48" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6">
    <animate attributeName="stroke-width" values="1;4;1" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.1;0.9" dur="2.2s" repeatCount="indefinite"/>
  </rect>
  <!-- Telegram Icon -->
  <g transform="translate(24, 15)">
    <circle cx="12" cy="12" r="11" fill="#ffffff" opacity="0.2"/>
    <path d="M4 12 L19 6 L16 18 L11 14 L8 16 L8 13 Z" fill="#ffffff">
      <animateTransform attributeName="transform" type="translate" values="0 0; 2 -1; 0 0" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="62" y="33" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" letter-spacing="0.5">JOIN TELEGRAM</text>
</svg>
