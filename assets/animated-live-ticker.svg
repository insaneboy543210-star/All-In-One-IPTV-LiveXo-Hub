<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 48" width="100%" height="48" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="tickerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tickerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <clipPath id="tickerClip">
      <rect x="180" y="4" width="750" height="40" rx="8"/>
    </clipPath>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="946" height="44" rx="12" fill="url(#tickerBg)" stroke="url(#tickerBorder)" stroke-width="1.5"/>

  <!-- Left Fixed Tag -->
  <rect x="12" y="8" width="150" height="32" rx="8" fill="#ef4444"/>
  <circle cx="28" cy="24" r="5" fill="#ffffff">
    <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
  </circle>
  <text x="42" y="29" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" letter-spacing="1">LIVE TICKER</text>

  <!-- Animated Marquee / Sliding Fixtures -->
  <g clip-path="url(#tickerClip)">
    <g transform="translate(750, 0)">
      <animateTransform attributeName="transform" type="translate" from="750 0" to="-1200 0" dur="20s" repeatCount="indefinite"/>
      <text x="0" y="29" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">
        ⚽ <tspan fill="#38bdf8">FOOTBALL LIVE:</tspan> AFC Champions Elite &amp; U17 World Championship  •  🏏 <tspan fill="#4ade80">CRICKET LIVE:</tspan> South Africa vs Bangladesh &amp; Asia Cup  •  📺 <tspan fill="#f43f5e">SPECIAL SPORTS:</tspan> Willow Cricket HD, FanCode Pro+, Sony Sports 1-5  •  ⚡ <tspan fill="#c084fc">ALTERNATIVE TO:</tspan> SPORZFY &amp; CricfyTV for PC &amp; Android TV  •  🚀 <tspan fill="#fbbf24">SERVER BANDWIDTH:</tspan> 1 TiB Multi-Server Zero-Lag Stream
      </text>
    </g>
  </g>
</svg>
