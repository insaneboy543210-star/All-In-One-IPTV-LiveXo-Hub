<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Animated Neon Border Gradient -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe">
        <animate attributeName="stop-color" values="#00f2fe;#4facfe;#9b51e0;#ff007f;#00f2fe" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#9b51e0">
        <animate attributeName="stop-color" values="#9b51e0;#ff007f;#00f2fe;#4facfe;#9b51e0" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ff007f">
        <animate attributeName="stop-color" values="#ff007f;#00f2fe;#4facfe;#9b51e0;#ff007f" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Shimmering Text Gradient -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#ffffff">
        <animate attributeName="offset" values="0.1;0.9;0.1" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="65%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Live Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="pulseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.8; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes barDance {
      0%, 100% { height: 10px; y: 190px; }
      50% { height: 35px; y: 165px; }
    }
    .neon-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 900; letter-spacing: -1px; }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; }
  </style>

  <!-- Container Box with Rounded Corners -->
  <rect x="5" y="5" width="940" height="350" rx="24" fill="url(#bgGrad)"/>
  <rect x="5" y="5" width="940" height="350" rx="24" fill="none" stroke="url(#neonBorder)" stroke-width="3.5" filter="url(#glow)"/>

  <!-- Background Decorative Glowing Orbs -->
  <circle cx="150" cy="80" r="100" fill="#38bdf8" opacity="0.12">
    <animate attributeName="opacity" values="0.08;0.22;0.08" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="90;115;90" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="280" r="120" fill="#ec4899" opacity="0.12">
    <animate attributeName="opacity" values="0.12;0.25;0.12" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="100;130;100" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Pulsing Top Live Badge -->
  <g transform="translate(60, 42)">
    <rect x="0" y="0" width="165" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <!-- Expanding Ping Ring -->
    <circle cx="20" cy="16" r="6" fill="#ef4444" opacity="0.8">
      <animate attributeName="r" values="5;14;5" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <!-- Solid Center Dot -->
    <circle cx="20" cy="16" r="5" fill="#ef4444"/>
    <text x="35" y="21" fill="#f87171" font-family="sans-serif" font-size="12" font-weight="800" letter-spacing="1">LIVE 4K BROADCAST</text>
  </g>

  <!-- Top Feature Pill -->
  <g transform="translate(240, 42)">
    <rect x="0" y="0" width="195" height="32" rx="16" fill="#0f291e" stroke="#10b981" stroke-width="1.5"/>
    <text x="18" y="21" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700">⚡ ZERO BANDWIDTH DELAY</text>
  </g>

  <!-- Competitor Pill -->
  <g transform="translate(450, 42)">
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#2d1537" stroke="#d946ef" stroke-width="1.5"/>
    <text x="16" y="21" fill="#f0abfc" font-family="sans-serif" font-size="12" font-weight="700">🏆 SPORZFY &amp; CRICFYTV ALT</text>
  </g>

  <!-- Top Right Live Status Ticker -->
  <g transform="translate(740, 42)">
    <rect x="0" y="0" width="150" height="32" rx="16" fill="#182234" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="20" cy="16" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
    </circle>
    <text x="34" y="21" fill="#7dd3fc" font-family="sans-serif" font-size="12" font-weight="700">SERVER ONLINE</text>
  </g>

  <!-- Main Animated Hero Title -->
  <text x="60" y="135" fill="#ffffff" class="neon-text" font-size="44">
    THE HOME OF <tspan fill="url(#neonBorder)">LIVE SPORTS</tspan>
  </text>
  <text x="60" y="185" fill="url(#shimmer)" class="neon-text" font-size="44">
    &amp; 4K IPTV STREAMING
  </text>

  <!-- Animated Audio / Spectrum Equalizer Bars -->
  <g transform="translate(750, 120)">
    <rect x="0" y="40" width="6" height="25" rx="3" fill="#38bdf8">
      <animate attributeName="height" values="15;50;20;60;15" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="50;15;45;5;50" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="12" y="30" width="6" height="35" rx="3" fill="#818cf8">
      <animate attributeName="height" values="35;15;55;25;35" dur="1.0s" repeatCount="indefinite"/>
      <animate attributeName="y" values="30;50;10;40;30" dur="1.0s" repeatCount="indefinite"/>
    </rect>
    <rect x="24" y="20" width="6" height="45" rx="3" fill="#c084fc">
      <animate attributeName="height" values="50;65;20;50;50" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="15;0;45;15;15" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="36" y="35" width="6" height="30" rx="3" fill="#f43f5e">
      <animate attributeName="height" values="25;55;15;60;25" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="40;10;50;5;40" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="48" y="25" width="6" height="40" rx="3" fill="#fb923c">
      <animate attributeName="height" values="45;20;60;30;45" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="20;45;5;35;20" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="60" y="35" width="6" height="30" rx="3" fill="#4ade80">
      <animate attributeName="height" values="20;50;35;58;20" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="45;15;30;7;45" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="72" y="42" width="6" height="23" rx="3" fill="#22d3ee">
      <animate attributeName="height" values="30;60;18;45;30" dur="1.25s" repeatCount="indefinite"/>
      <animate attributeName="y" values="35;5;47;20;35" dur="1.25s" repeatCount="indefinite"/>
    </rect>
    <text x="-15" y="82" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1">LIVE STREAM BITRATE</text>
  </g>

  <!-- Subtitle Text -->
  <text x="60" y="222" fill="#94a3b8" class="sub-text" font-size="15">
    Stream High-Stakes Football, Cricket, Sony Sports, Willow TV, BDIX Channels &amp; 500+ Worldwide Feeds
  </text>
  <text x="60" y="244" fill="#64748b" class="sub-text" font-size="13">
    Multi-Server Instant Failover • ClearKey DRM Decryption • Web, Mobile, Android TV &amp; PC Ready
  </text>

  <!-- Interactive/Highlighted Feature Cards Row -->
  <g transform="translate(60, 275)">
    <!-- Card 1: 500+ Channels -->
    <rect x="0" y="0" width="185" height="58" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="18" y="25" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="900">500+ CHANNELS</text>
    <text x="18" y="44" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="700">SPORTS, MOVIES, BD LIVE</text>

    <!-- Card 2: 100+ Live Fixtures -->
    <rect x="200" y="0" width="185" height="58" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="218" y="25" fill="#f43f5e" font-family="sans-serif" font-size="18" font-weight="900">100+ FIXTURES</text>
    <text x="218" y="44" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="700">CRICKET &amp; FOOTBALL</text>

    <!-- Card 3: 4K HDR 60FPS -->
    <rect x="400" y="0" width="185" height="58" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="418" y="25" fill="#a855f7" font-family="sans-serif" font-size="18" font-weight="900">4K HDR 60FPS</text>
    <text x="418" y="44" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="700">ULTRA LOW LATENCY</text>

    <!-- Card 4: Free Web Access -->
    <rect x="600" y="0" width="230" height="58" rx="14" fill="#0f172a" stroke="url(#neonBorder)" stroke-width="2"/>
    <text x="618" y="25" fill="#10b981" font-family="sans-serif" font-size="18" font-weight="900">100% FREE NO ADS</text>
    <text x="618" y="44" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700">NO SUBSCRIPTION REQUIRED</text>
  </g>
</svg>
