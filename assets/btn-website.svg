<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 54" width="240" height="54">
  <defs>
    <linearGradient id="webBtnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#ec4899;#3b82f6;#8b5cf6" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="webBtnGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="3" y="3" width="234" height="48" rx="24" fill="url(#webBtnGrad)" filter="url(#webBtnGlow)"/>
  <!-- Animated Pulse Ripple -->
  <rect x="3" y="3" width="234" height="48" rx="24" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6">
    <animate attributeName="stroke-width" values="1;4;1" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite"/>
  </rect>
  <!-- Globe / Play Icon -->
  <g transform="translate(24, 15)">
    <circle cx="12" cy="12" r="11" fill="none" stroke="#ffffff" stroke-width="2"/>
    <polygon points="10,7 18,12 10,17" fill="#ffffff">
      <animateTransform attributeName="transform" type="translate" values="0 0; 2 0; 0 0" dur="1.2s" repeatCount="indefinite"/>
    </polygon>
  </g>
  <text x="62" y="33" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" letter-spacing="0.5">LAUNCH LIVEXO</text>
</svg>
