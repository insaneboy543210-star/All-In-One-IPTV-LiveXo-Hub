<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 54" width="260" height="54">
  <defs>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="260" height="54" rx="12" fill="url(#btnGrad)" filter="url(#shadow)"/>
  <rect width="258" height="52" x="1" y="1" rx="11" fill="none" stroke="#7dd3fc" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Globe / Web Icon -->
  <g transform="translate(18, 13)">
    <circle cx="14" cy="14" r="14" fill="#ffffff" fill-opacity="0.15"/>
    <circle cx="14" cy="14" r="8" fill="none" stroke="#ffffff" stroke-width="1.8"/>
    <ellipse cx="14" cy="14" rx="3.5" ry="8" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="6" y1="14" x2="22" y2="14" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Button Texts -->
  <text x="56" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="800" fill="#bae6fd" letter-spacing="1">OFFICIAL WEBSITE</text>
  <text x="56" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="0.2">Watch LiveXo Web</text>

  <!-- Arrow -->
  <path d="M 232 27 L 224 21 M 232 27 L 224 33 M 232 27 L 218 27" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
